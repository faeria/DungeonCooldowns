name: Release on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Package, tag and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate addon and compute version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          test -f DungeonCooldowns.toc

          version="$(sed -n 's/^## Version:[[:space:]]*//p' DungeonCooldowns.toc | tr -d '\r' | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "The TOC does not contain a Version field." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported TOC version: $version" >&2
            exit 1
          fi

          while IFS= read -r addon_file; do
            addon_file="${addon_file%$'\r'}"
            if [[ -z "$addon_file" || "$addon_file" == \#* ]]; then
              continue
            fi
            if [[ "$addon_file" == *.lua || "$addon_file" == *.xml ]]; then
              test -f "$addon_file" || {
                echo "Missing TOC file: $addon_file" >&2
                exit 1
              }
            fi
          done < DungeonCooldowns.toc

          tag="v${version}.${GITHUB_RUN_NUMBER}"
          asset="DungeonCooldowns-${tag}.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Build installable archive
        env:
          ASSET: ${{ steps.metadata.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail

          package_root="$(mktemp -d)"
          addon_dir="$package_root/DungeonCooldowns"
          mkdir -p "$addon_dir"

          cp DungeonCooldowns.toc ./*.lua README.md CHANGELOG.md SOURCE_NOTES.md "$addon_dir/"
          if [[ -f LICENSE ]]; then
            cp LICENSE "$addon_dir/"
          fi

          (
            cd "$package_root"
            zip -r "$GITHUB_WORKSPACE/$ASSET" DungeonCooldowns
          )
          unzip -t "$ASSET"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          ASSET: ${{ steps.metadata.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" "$GITHUB_SHA" -m "DungeonCooldowns $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "DungeonCooldowns $TAG" \
              --generate-notes
          fi
